<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timers</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  /* Invoerbalk */
  .add-bar {
    width: 100%;
    max-width: 380px;
    display: flex;
    gap: 6px;
    background: #1e293b;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #334155;
    margin-bottom: 12px;
  }

  .add-bar input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: normal;
    outline: none;
  }

  .add-bar input[type="text"] {
    flex: 1;
    padding: 4px;
  }

  .add-bar input[type="number"] {
    width: 38px;
    text-align: center;
    border-left: 1px solid #334155;
  }

  .add-bar button {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 16px;
    font-weight: normal;
    cursor: pointer;
  }

  /* Grid geoptimaliseerd voor ca. 7 timers per pagina */
  .timer-grid {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Timer Rijen met Drag & Drop */
  .timer-row {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.15s ease, background-color 0.2s ease;
    cursor: grab;
    touch-action: none;
  }

  .timer-row.dragging {
    opacity: 0.5;
    background: #334155;
  }

  /* Links uitgelijnde naam */
  .timer-label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: normal;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
    flex: 1;
    padding-right: 8px;
  }

  .timer-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Tijd rechts uitgelijnd direct voor de knoppen */
  .timer-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    font-weight: normal;
    color: #38bdf8;
    letter-spacing: -0.3px;
    text-align: right;
    min-width: 48px;
  }

  .timer-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn {
    border: none;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 10px;
    font-weight: normal;
    cursor: pointer;
    text-transform: uppercase;
  }

  .btn-start { background: #0369a1; color: #e0f2fe; }
  .btn-pause { background: #b45309; color: #fef3c7; }
  .btn-reset { background: #334155; color: #94a3b8; padding: 5px 6px; }
  .btn-del   { background: transparent; color: #64748b; padding: 2px 4px; font-size: 12px; }
  .btn-del:hover { color: #ef4444; }

  /* Waarschuwing (< 10 sec) */
  .warning {
    border-color: #f59e0b;
    background: #271e0c;
  }
  .warning .timer-time {
    color: #fbbf24;
  }

  /* Afgelopen */
  .finished {
    border-color: #ef4444;
    background: #291215;
    animation: blink 0.6s infinite alternate;
  }
  .finished .timer-time {
    color: #f87171;
  }

  @keyframes blink {
    from { border-color: #ef4444; }
    to { border-color: transparent; }
  }
</style>
</head>
<body>

<div class="add-bar">
  <input type="text" id="label" placeholder="Naam timer..." maxlength="20">
  <input type="number" id="min" placeholder="m" min="0" max="99" value="5">
  <input type="number" id="sec" placeholder="s" min="0" max="59" value="0">
  <button onclick="addTimer()">+</button>
</div>

<div id="grid" class="timer-grid"></div>

<script>
let count = 0;
let timersList = [];
let activeIntervals = {};

window.onload = function() {
  const saved = localStorage.getItem("saved_timers");
  if (saved) {
    try {
      timersList = JSON.parse(saved);
    } catch(e) {
      timersList = [];
    }
    renderAll();
  }
};

function saveToStorage() {
  localStorage.setItem("saved_timers", JSON.stringify(timersList));
}

function renderAll() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  timersList.forEach(t => renderTimer(t));
}

function addTimer() {
  const labelInput = document.getElementById("label");
  const minInput = document.getElementById("min");
  const secInput = document.getElementById("sec");

  const label = labelInput.value.trim() || `Timer ${++count}`;
  const total = ((parseInt(minInput.value) || 0) * 60) + (parseInt(secInput.value) || 0);

  if (total <= 0) return;

  const timerObj = {
    id: Date.now(),
    label: label,
    total: total,
    rem: total,
    running: false
  };

  timersList.push(timerObj);
  saveToStorage();
  renderAll();

  labelInput.value = "";
}

function renderTimer(timerObj) {
  const id = timerObj.id;
  const grid = document.getElementById("grid");

  const row = document.createElement("div");
  row.className = "timer-row";
  if (timerObj.rem <= 10 && timerObj.rem > 0) row.classList.add("warning");
  if (timerObj.rem <= 0) row.classList.add("finished");
  row.id = `t-${id}`;
  row.draggable = true;

  const isRunning = timerObj.running;

  row.innerHTML = `
    <span class="timer-label" title="${timerObj.label}">${timerObj.label}</span>
    <div class="timer-controls">
      <span class="timer-time" id="disp-${id}">${fmt(timerObj.rem)}</span>
      <div class="timer-actions">
        <button class="btn ${isRunning ? 'btn-pause' : 'btn-start'}" id="btn-${id}" onclick="toggle(${id})">${isRunning ? 'Pauze' : 'Start'}</button>
        <button class="btn btn-reset" onclick="resetTimer(${id})">↺</button>
        <button class="btn btn-del" onclick="del(${id})">✕</button>
      </div>
    </div>
  `;

  // Drag & Drop events toevoegen
  addDragListeners(row, id);

  grid.appendChild(row);

  if (isRunning && !activeIntervals[id]) {
    runInterval(id);
  }
}

function fmt(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function toggle(id) {
  const timerObj = timersList.find(t => t.id === id);
  if (!timerObj) return;

  if (timerObj.running) {
    pauseTimer(id);
  } else {
    timerObj.running = true;
    saveToStorage();
    const btn = document.getElementById(`btn-${id}`);
    if (btn) {
      btn.innerText = "Pauze";
      btn.className = "btn btn-pause";
    }
    runInterval(id);
  }
}

function runInterval(id) {
  if (activeIntervals[id]) clearInterval(activeIntervals[id]);

  activeIntervals[id] = setInterval(() => {
    const timerObj = timersList.find(t => t.id === id);
    if (!timerObj || !timerObj.running) {
      clearInterval(activeIntervals[id]);
      return;
    }

    timerObj.rem--;
    const disp = document.getElementById(`disp-${id}`);
    if (disp) disp.innerText = fmt(timerObj.rem);

    const row = document.getElementById(`t-${id}`);

    if (timerObj.rem === 10) {
      if (row) row.classList.add("warning");
      beep(600, 0.1);
    }

    if (timerObj.rem <= 0) {
      clearInterval(activeIntervals[id]);
      timerObj.running = false;
      timerObj.rem = 0;
      if (row) {
        row.classList.remove("warning");
        row.classList.add("finished");
      }
      pauseTimerUI(id);
      playFinishedBeeps();
    }
    saveToStorage();
  }, 1000);
}

function pauseTimer(id) {
  const timerObj = timersList.find(t => t.id === id);
  if (timerObj) {
    timerObj.running = false;
    saveToStorage();
  }
  if (activeIntervals[id]) {
    clearInterval(activeIntervals[id]);
    delete activeIntervals[id];
  }
  pauseTimerUI(id);
}

function pauseTimerUI(id) {
  const btn = document.getElementById(`btn-${id}`);
  if (btn) {
    btn.innerText = "Start";
    btn.className = "btn btn-start";
  }
}

function resetTimer(id) {
  pauseTimer(id);
  const timerObj = timersList.find(t => t.id === id);
  if (timerObj) {
    timerObj.rem = timerObj.total;
    saveToStorage();
    const row = document.getElementById(`t-${id}`);
    if (row) row.classList.remove("warning", "finished");
    const disp = document.getElementById(`disp-${id}`);
    if (disp) disp.innerText = fmt(timerObj.rem);
  }
}

function del(id) {
  pauseTimer(id);
  timersList = timersList.filter(t => t.id !== id);
  saveToStorage();
  renderAll();
}

/* Drag & Drop Logica */
let dragSrcId = null;

function addDragListeners(row, id) {
  row.addEventListener('dragstart', (e) => {
    dragSrcId = id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
  });

  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });

  row.addEventListener('drop', (e) => {
    e.preventDefault();
    if (dragSrcId !== null && dragSrcId !== id) {
      const fromIndex = timersList.findIndex(t => t.id === dragSrcId);
      const toIndex = timersList.findIndex(t => t.id === id);

      const [movedItem] = timersList.splice(fromIndex, 1);
      timersList.splice(toIndex, 0, movedItem);

      saveToStorage();
      renderAll();
    }
  });

  // Touch ondersteuning voor mobiel
  row.addEventListener('touchstart', handleTouchStart, false);
  row.addEventListener('touchmove', handleTouchMove, false);
  row.addEventListener('touchend', handleTouchEnd, false);
}

let touchSrcId = null;
let touchElement = null;

function handleTouchStart(e) {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  touchElement = e.currentTarget;
  touchSrcId = parseInt(touchElement.id.replace('t-', ''));
  touchElement.classList.add('dragging');
}

function handleTouchMove(e) {
  if (!touchElement) return;
  e.preventDefault();
  const touch = e.touches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const targetRow = target ? target.closest('.timer-row') : null;

  if (targetRow && targetRow !== touchElement) {
    const targetId = parseInt(targetRow.id.replace('t-', ''));
    const fromIndex = timersList.findIndex(t => t.id === touchSrcId);
    const toIndex = timersList.findIndex(t => t.id === targetId);

    if (fromIndex !== -1 && toIndex !== -1) {
      const [movedItem] = timersList.splice(fromIndex, 1);
      timersList.splice(toIndex, 0, movedItem);
      renderAll();
    }
  }
}

function handleTouchEnd() {
  if (touchElement) {
    touchElement.classList.remove('dragging');
    touchElement = null;
    touchSrcId = null;
    saveToStorage();
  }
}

function beep(freq, duration) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = freq;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e){}
}

function playFinishedBeeps() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let count = 0;
    const interval = setInterval(() => {
      if (count >= 5) {
        clearInterval(interval);
        return;
      }
      const osc = ctx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
      count++;
    }, 250);
  } catch(e){}
}
</script>

</body>
</html>
