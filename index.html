<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timers</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: normal;
  }

  body {
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  /* Topbalk met Titel en Plus-knop */
  .app-header {
    width: 100%;
    max-width: 380px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .app-title {
    font-size: 14px;
    color: #94a3b8;
  }

  .btn-add-main {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Grid voor timers */
  .timer-grid {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Timer Rijen met Voortgangsbalk & Drag & Drop */
  .timer-row {
    position: relative;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.15s ease, background-color 0.2s ease;
    cursor: grab;
    touch-action: none;
    overflow: hidden;
  }

  /* Subtiele voortgangslaag achter de tekst en knoppen */
  .progress-bg {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: rgba(56, 189, 248, 0.12);
    pointer-events: none;
    transition: width 0.3s linear;
  }

  .timer-row.dragging {
    opacity: 0.5;
    background: #334155;
  }

  .timer-label {
    position: relative;
    z-index: 1;
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
    flex: 1;
    padding-right: 8px;
  }

  .timer-controls {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .timer-time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 14px;
    color: #38bdf8;
    letter-spacing: -0.3px;
    text-align: right;
    min-width: 55px;
  }

  .timer-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn {
    border: none;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 10px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .btn-start { background: #0369a1; color: #e0f2fe; }
  .btn-pause { background: #b45309; color: #fef3c7; }
  .btn-reset { background: #334155; color: #94a3b8; padding: 5px 6px; }
  .btn-del   { background: transparent; color: #64748b; padding: 2px 4px; font-size: 12px; }
  .btn-del:hover { color: #ef4444; }

  /* Waarschuwing & Afgelopen */
  .warning { border-color: #f59e0b; background: #271e0c; }
  .warning .progress-bg { background: rgba(245, 158, 11, 0.18); }
  .warning .timer-time { color: #fbbf24; }

  .finished { border-color: #ef4444; background: #291215; animation: blink 0.6s infinite alternate; }
  .finished .progress-bg { width: 100% !important; background: rgba(239, 68, 68, 0.25); }
